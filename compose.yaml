services:
  mongodb:
    image: mongo:8.2
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: fupran
    labels:
      com.symfony.server.service-prefix: 'MDB'
    ports:
      - "27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    healthcheck:
      test: mongosh --quiet --eval "db.adminCommand('ping').ok"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  mongodb_data:
  mongodb_config:
